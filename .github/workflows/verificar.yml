name: verificar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- Puertas duras: si alguna falla, el commit esta mal ---

      - name: Validar estructura de la guia
        run: python3 tools/verificar.py

      - name: Los conteos del README tienen que calzar con guia/
        run: python3 tools/sincronizar.py --revisar

      - name: Construir los datos del buscador
        run: python3 tools/construir.py

      - name: El buscador tiene que quedar sincronizado con la guia
        run: |
          if ! git diff --quiet -- datos.json; then
            echo "::error::datos.json esta desactualizado. Corre: python3 tools/construir.py"
            git diff --stat -- datos.json
            exit 1
          fi

      # --- Enlaces: informativo, nunca hace fallar el job ---
      # Muchos sitios oficiales (.gob.cl) devuelven 403 o tienen el certificado roto y abren
      # igual en un navegador: si esto fallara el job, un sitio caido bloquearia los commits.

      - name: Revisar los enlaces citados (informativo)
        run: |
          set +e
          python3 tools/verificar.py --urls > enlaces.txt 2>&1
          echo "### Enlaces citados" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(Capitulos|Evidencia|Medidas|Datos)' enlaces.txt >> "$GITHUB_STEP_SUMMARY" || true
          tail -3 enlaces.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Informe de verificacion (JSON)
        run: python3 tools/verificar.py --json > verificacion.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacion
          path: |
            verificacion.json
            enlaces.txt
          if-no-files-found: warn
